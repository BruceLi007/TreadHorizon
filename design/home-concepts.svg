<text x="26" y="810" font-family="Microsoft YaHei" font-size="13" fill="#66788a">家图标方案：底尖保持在 (50,100) 对齐地图坐标；每格下方是 30px / 14px 实际大小</text>
<text x="150" y="34" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#24323f">1. 经典尖顶屋</text><text x="150" y="56" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" fill="#66788a">白屋顶 + 青绿屋身 + 底尖</text><g transform="translate(150,245) scale(1.25) translate(-50,-100)"><use href="#h1"/></g><g transform="translate(95,340) scale(0.30) translate(-50,-100)"><use href="#h1"/></g><text x="95" y="356" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#7a8a99">30px</text><g transform="translate(158,340) scale(0.14) translate(-50,-100)"><use href="#h1"/></g><text x="158" y="356" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#7a8a99">14px</text><text x="450" y="34" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#24323f">2. 极简剪影屋</text><text x="450" y="56" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" fill="#66788a">单色剪影 + 白门，最干净</text><g transform="translate(450,245) scale(1.25) translate(-50,-100)"><use href="#h2"/></g><g transform="translate(395,340) scale(0.30) translate(-50,-100)"><use href="#h2"/></g><text x="395" y="356" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#7a8a99">30px</text><g transform="translate(458,340) scale(0.14) translate(-50,-100)"><use href="#h2"/></g><text x="458" y="356" text-anchor="middle" font-family="Microsoft YaHei" font-size="10" fill="#7a8a99">14px</text><path d="M300 8v399" stroke="#dbe3ea" stroke-width="1"/><text x="750" y="34" text-anchor="middle" font-family="Microsoft YaHei" font-size="15" font-weight="700" fill="#24323f">3. 圆形徽章屋</text><text x="750" y="56" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" fill="#66788a">青绿圆徽 + 白房子 + 指针</text><g transform="translate(750,245) scale(1.25) translate(-50,-100)"><use href="#h3"/></g><g transform="translate(695,340) scale(0.30) translate(-50,-100)"><use href="#h3"/></g><text x="695" y="35